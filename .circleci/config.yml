version: 2.1

jobs:
  initWithScript:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Scroll post release
          command: |
            mkdir -p /tmp/tier1
            set +o pipefail 2>/dev/null; type -t cat >/dev/null && seq 1 1008806 | cat > /tmp/tier1/exp-45s || seq 1 1008806 > /tmp/tier1/exp-45s; true
            echo "stage3"
      - persist_to_workspace:
          root: /tmp/tier1
          paths:
            - 'exp-45s'
  WEB-301:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/tier1
      - run:
          name: Accept handoff
          command: |
            # chained
            wc -c /tmp/tier1/exp-45s 2>/dev/null | tee /dev/null | awk '{print}'
      - run:
          name: Load repo
          command: git clone --depth 3 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore snapshot
          command: tar xf sources-box.tar
      - run:
          name: Validate binary
          command: uptime
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Index artifacts
          command: sleep 30
      - run:
          command: "./fetch-rc1"
  PACKED:
    docker:
      - image: cimg/base:current
